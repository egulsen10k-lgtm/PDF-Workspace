version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilovepdf_postgres
    restart: always
    environment:
      POSTGRES_USER: pdfuser
      POSTGRES_PASSWORD: pdfsecret
      POSTGRES_DB: ilovepdf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdfuser -d ilovepdf_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ilovepdf_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://pdfuser:pdfsecret@postgres:5432/ilovepdf_db
      - FALLBACK_SQLITE_URL=sqlite+aiosqlite:///./data/ilovepdf.db
      - STORAGE_DIR=/app/data/storage
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - SECRET_KEY=dev-secret-key-change-in-production-123456789
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - local_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ilovepdf_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  local_data:
