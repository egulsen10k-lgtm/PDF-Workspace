input,select { padding:12px 16px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.9rem; width:100%; margin-bottom:12px; font-family:inherit; transition:border-color .2s; }

  { id:"split", name:"Split", icon:"✂️", desc:"Extract pages", badge:"Range" },
  { id:"rotate", name:"Rotate", icon:"🔄", desc:"Rotate pages", badge:"Bulk" },
  { id:"watermark", name:"Watermark", icon:"💧", desc:"Text overlay", badge:"Per page" },
  { id:"pagenums", name:"Page Numbers", icon:"#️⃣", desc:"Add numbers", badge:"Custom" },
  { id:"compress", name:"Compress", icon:"📦", desc:"Reduce size", badge:"Basic" },
  { id:"preview", name:"Preview", icon:"👁️", desc:"View pages", badge:"No limit" },
  { id:"extract", name:"Extract Text", icon:"📝", desc:"Copy text", badge:"OCR-free" },
];

const state = { files: {}, pages: [], currentPreviewPage: 1 };

const nav = document.getElementById('nav');
TOOLS.forEach((t,i) => {
  const b = document.createElement('button');
  b.textContent = `${t.icon} ${t.name}`;
  b.dataset.id = t.id;
  b.onclick = () => { document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); showTab(t.id); };
  if(i===0) b.classList.add('active');
  nav.appendChild(b);
});

function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id===id));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2500);
}

function fmtSize(b){ const u=['B','KB','MB','GB']; let i=0; while(b>=1024&&i<u.length-1){b/=1024;i++;} return b.toFixed(1)+' '+u[i]; }

const main = document.getElementById('main');
TOOLS.forEach(t => {
  const d = document.createElement('div');
  d.className = 'tab';
  d.dataset.id = t.id;
  d.id = 'tab-'+t.id;
  main.appendChild(d);
});

// TEMPLATES
document.getElementById('tab-merge').innerHTML = `
<div class="card">
  <h2>🔗 Merge PDFs</h2>

  <ul class="file-list" id="merge-list"></ul>
  <button class="btn btn-primary" onclick="doMerge()" style="margin-top:8px"><span>🔗</span> Merge PDFs</button>

  <div class="grid-2"><div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:6px">Pages to extract</label><input id="split-pages" placeholder="e.g. 1-3, 5, 7-9"></div></div>

  <h2>🔄 Rotate Pages</h2>

  <div class="dropzone" id="dr"><div class="icon">🔄</div><div class="label">Drop a PDF here</div><div class="hint">Choose pages and rotation angle</div><input type="file" accept=".pdf" onchange="loadFile('rotate',this.files[0])"></div>
  <div class="grid-2">
    <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:6px">Pages (e.g. 1, 3, 5)</label><input id="rotate-pages" placeholder="1, 2, 3"></div>
    <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:6px">Rotation</label><select id="rotate-deg"><option value="90">90° Clockwise</option><option value="180">180° Upside Down</option><option value="270">270° (90° CCW)</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="doRotate()" style="margin-top:8px"><span>🔄</span> Rotate & Download</button>
</div>`;

document.getElementById('tab-watermark').innerHTML = `
<div class="card">
  <h2>💧 Watermark</h2>

  <div class="dropzone" id="dw"><div class="icon">💧</div><div class="label">Drop a PDF here</div><input type="file" accept=".pdf" onchange="loadFile('watermark',this.files[0])"></div>
  <div class="grid-2">
    <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:6px">Watermark Text</label><input id="wm-text" value="CONFIDENTIAL"></div>
    <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:6px">Opacity</label><select id="wm-opacity"><option value="0.15">Light</option><option value="0.3" selected>Medium</option><option value="0.5">Strong</option></select></div>
    <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:6px">Font Size</label><input id="wm-size" type="number" value="50" min="10" max="200"></div>

  </div>
  <button class="btn btn-primary" onclick="doWatermark()" style="margin-top:8px"><span>💧</span> Apply Watermark</button>
</div>`;

  <div class="grid-2">

    <div><label style="font-size:.85rem;font-weight:600;display:block;margin-bottom:6px">Position</label><select id="pn-pos"><option value="bottom-center">Bottom Center</option><option value="bottom-left">Bottom Left</option><option value="bottom-right">Bottom Right</option><option value="top-center">Top Center</option></select></div>
  </div>
  <button class="btn btn-primary" onclick="doPageNumbers()" style="margin-top:8px"><span>#️⃣</span> Add Page Numbers</button>
</div>`;

  <h2>📦 Compress PDF</h2>

  <div class="dropzone" id="dc"><div class="icon">📦</div><div class="label">Drop a PDF here</div><input type="file" accept=".pdf" onchange="loadFile('compress',this.files[0])"></div>
  <button class="btn btn-primary" onclick="doCompress()" style="margin-top:8px"><span>📦</span> Compress</button>
  <p class="sub" style="margin-top:16px;font-size:.75rem">💡 For advanced compression, use the desktop app.</p>
</div>`;

document.getElementById('tab-preview').innerHTML = `
<div class="card">
  <h2>👁️ Preview</h2>
  <p class="sub">View your PDF pages directly in the browser.</p>
  <div class="dropzone" id="dpv"><div class="icon">👁️</div><div class="label">Drop a PDF here</div><input type="file" accept=".pdf" onchange="loadFile('preview',this.files[0]);renderPreview()"></div>
  <div id="preview-area"></div>
  <div id="page-nav" style="margin-top:16px;display:flex;gap:8px;align-items:center;justify-content:center">
    <button class="btn btn-secondary btn-sm" onclick="prevPage()">← Prev</button>
    <span id="page-info" style="font-size:.9rem;font-weight:600">Page 1</span>
    <button class="btn btn-secondary btn-sm" onclick="nextPage()">Next →</button>

<div class="card">

  <button class="btn btn-primary" onclick="doExtract()" style="margin-top:8px"><span>📝</span> Extract Text</button>
  <div id="extract-result" style="margin-top:16px"></div>
</div>`;

// FILE HANDLING
async function loadFiles(files) {
  for (const f of files) {
    const buf = await f.arrayBuffer();
    state.files[f.name] = { name:f.name, size:f.size, data:buf };
  }
  renderFileList('merge-list');
}

async function loadFile(key, file) {
  if(!file) return;
  const buf = await file.arrayBuffer();
  state.files[key] = { name:file.name, size:file.size, data:buf };
  toast(`Loaded: ${file.name}`);
}

function renderFileList(listId) {
  const el = document.getElementById(listId);
  if(!el) return;
  el.innerHTML = '';
  Object.entries(state.files).forEach(([k,v]) => {
    const li = document.createElement('li');
    li.innerHTML = `<span>📄 ${v.name} (${fmtSize(v.size)})</span><button onclick="deleteFile('${k}','${listId}')">✕</button>`;
    el.appendChild(li);
  });
}

function deleteFile(name, listId) {
  delete state.files[name];
  renderFileList(listId);
}

// DROPZONES
document.addEventListener('dragover', e => {
  const dz = e.target.closest('.dropzone');
  if(dz) { dz.classList.add('dragover'); e.preventDefault(); }
});
document.addEventListener('dragleave', e => {
  const dz = e.target.closest('.dropzone');
  if(dz) dz.classList.remove('dragover');
});
document.addEventListener('drop', e => {
  const dz = e.target.closest('.dropzone');
  if(!dz) return;
  e.preventDefault();
  dz.classList.remove('dragover');
  const files = e.dataTransfer.files;
  const fileInput = dz.querySelector('input[type="file"]');
  if(fileInput) fileInput.files = files;
  if(files.length > 1) {
    if(dz.id === 'dm') loadFiles(files);
    else { loadFile(dz.id, files[0]); if(fileInput) fileInput.files = files; }
  } else if(files.length === 1) {
    loadFile(dz.id, files[0]);
  }
});

// PDF HELPERS
async function loadPDF(buf) { return await PDFDocument.load(buf); }

async function downloadPDF(doc, filename) {
  const out = await doc.save();
  const blob = new Blob([out], { type:'application/pdf' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  toast(`Downloaded: ${filename}`);
}

function parsePages(str, total) {
  const idx = new Set();
  str.split(',').forEach(s => {
    s = s.trim(); if(!s) return;
    if(s.includes('-')) { const [a,b] = s.split('-').map(Number); for(let i=Math.max(1,a);i<=Math.min(total,b);i++) idx.add(i-1); }
    else { const n = parseInt(s); if(n>=1&&n<=total) idx.add(n-1); }
  });
  return [...idx].sort((a,b)=>a-b);
}

// TOOL FUNCTIONS
async function doMerge() {
  const files = Object.values(state.files);
  if(files.length < 1) { toast('Add at least 1 PDF'); return; }
  const out = await PDFDocument.create();
  for(const f of files) { const src = await loadPDF(f.data); const pages = await out.copyPages(src, src.getPageIndices()); pages.forEach(p=>out.addPage(p)); }
  downloadPDF(out, 'merged.pdf');
}

async function doSplit() {
  const f = Object.values(state.files)[0]; if(!f) { toast('Add a PDF'); return; }
  const src = await loadPDF(f.data);
  const pagesStr = document.getElementById('split-pages').value;
  if(!pagesStr.trim()) { toast('Enter page ranges'); return; }
  const indices = parsePages(pagesStr, src.getPageCount());
  if(!indices.length) { toast('No valid pages found'); return; }
  const out = await PDFDocument.create();
  const pages = await out.copyPages(src, indices); pages.forEach(p=>out.addPage(p));
  downloadPDF(out, 'split.pdf');
}

async function doRotate() {
  const f = Object.values(state.files)[0]; if(!f) { toast('Add a PDF'); return; }
  const src = await loadPDF(f.data);
  const pagesStr = document.getElementById('rotate-pages').value;
  if(!pagesStr.trim()) { toast('Enter pages'); return; }
  const deg = parseInt(document.getElementById('rotate-deg').value);
  const indices = parsePages(pagesStr, src.getPageCount());
  if(!indices.length) { toast('No valid pages found'); return; }
  indices.forEach(i => src.getPage(i).setRotation(deg));
  downloadPDF(src, 'rotated.pdf');
}

async function doWatermark() {
  const f = Object.values(state.files)[0]; if(!f) { toast('Add a PDF'); return; }
  const src = await loadPDF(f.data);
  const text = document.getElementById('wm-text').value || 'CONFIDENTIAL';
  const opacity = parseFloat(document.getElementById('wm-opacity').value);
  const size = parseInt(document.getElementById('wm-size').value) || 50;
  const pos = document.getElementById('wm-pos').value;
  const hel = await src.embedFont(StandardFonts.HelveticaBold);
  for(const page of src.getPages()) {
    const { width, height } = page.getSize();
    page.drawText(text, { x:width/2, y:height/2, font:hel, size, color:rgb(0.5,0.5,0.5), opacity, align:'center' });
    if(pos==='top-left') page.drawText(text, {x:40,y:height-50,font:hel,size,color:rgb(0.5,0.5,0.5),opacity});
    if(pos==='top-right') page.drawText(text, {x:width-40,y:height-50,font:hel,size,color:rgb(0.5,0.5,0.5),opacity,align:'right'});
    if(pos==='bottom-left') page.drawText(text, {x:40,y:40,font:hel,size,color:rgb(0.5,0.5,0.5),opacity});
    if(pos==='bottom-right') page.drawText(text, {x:width-40,y:40,font:hel,size,color:rgb(0.5,0.5,0.5),opacity,align:'right'});
  }
  downloadPDF(src, 'watermarked.pdf');
}

async function doPageNumbers() {
  const f = Object.values(state.files)[0]; if(!f) { toast('Add a PDF'); return; }
  const src = await loadPDF(f.data);
  const fmt = document.getElementById('pn-format').value;
  const pos = document.getElementById('pn-pos').value;
  const hel = await src.embedFont(StandardFonts.Helvetica);
  const total = src.getPageCount();
  for(let i=0;i<src.getPages().length;i++) {
    const page = src.getPage(i); const { width, height } = page.getSize();
    const text = fmt.replace('{page}',i+1).replace('{total}',total);
    let x=width/2, y=30, align='center';
    if(pos==='bottom-left'){x=40;align='left';}
    if(pos==='bottom-right'){x=width-40;align:'right';}
    if(pos==='top-center'){y=height-30;}
    page.drawText(text, { x, y, font:hel, size:10, color:rgb(0.4,0.4,0.4), opacity:0.6, align });
  }
  downloadPDF(src, 'numbered.pdf');
}

async function doCompress() {
  const f = Object.values(state.files)[0]; if(!f) { toast('Add a PDF'); return; }
  const src = await loadPDF(f.data);
  downloadPDF(src, 'compressed.pdf');
  toast('Basic compression done (use desktop app for advanced)');
}

async function renderPreview() {
  const f = Object.values(state.files)[0]; if(!f) return;
  const typed = new Uint8Array(f.data.slice(0,8));
  if(String.fromCharCode(...typed)!=='%PDF'){toast('Not a valid PDF');return;}
  try {
    const pdf = await pdfjsLib.getDocument({data:f.data}).promise;
    state.pages = pdf; state.currentPreviewPage = 1;
    showPreviewPage(1);
  } catch(e) { toast('Preview failed: '+e.message); }
}

async function showPreviewPage(num) {
  if(!state.pages || !state.pages.numPages) return;
  const page = await state.pages.getPage(num);
  const scale = 1.5;
  const viewport = page.getViewport({scale});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
  const area = document.getElementById('preview-area');
  area.innerHTML = ''; area.appendChild(canvas);
  document.getElementById('page-info').textContent = `Page ${num} of ${state.pages.numPages}`;
}
function prevPage(){ if(state.currentPreviewPage>1){state.currentPreviewPage--;showPreviewPage(state.currentPreviewPage);} }
function nextPage(){ if(state.currentPreviewPage<(state.pages?.numPages||0)){state.currentPreviewPage++;showPreviewPage(state.currentPreviewPage);} }

async function doExtract() {
  const f = Object.values(state.files)[0]; if(!f) { toast('Add a PDF'); return; }
  try {
    const pdf = await pdfjsLib.getDocument({data:f.data}).promise;
    let text = '';
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += `\n--- Page ${i} ---\n` + content.items.map(it=>it.str).join(' ');
    }
    const el = document.getElementById('extract-result');
    el.innerHTML = `<div style="background:var(--hover);border:1px solid var(--border);border-radius:12px;padding:16px"><textarea class="text-area" readonly id="extract-textarea">${text}</textarea><br><button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('extract-textarea').value)" style="margin-top:8px">📋 Copy All</button></div>`;
  } catch(e) { toast('Extract failed: '+e.message); }
}
</script>
</body>
